spring.application.name=estudoPI
server.port=8080

# ${VARIAVEL:default} -> usa a variável de ambiente se existir, senão o default.
# DB_PASSWORD NÃO tem default de propósito: a senha nunca fica no código.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auladb}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD}

# update = o Hibernate cria/atualiza as tabelas sozinho a partir das @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
