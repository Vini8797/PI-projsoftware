# Sobe app + banco com um comando: docker compose up -d --build
# Precisa do arquivo .env com DB_PASSWORD (Copy-Item .env.example .env)
#
# O compose cria uma rede automaticamente. Dentro dela, cada serviço é
# acessível pelo NOME do serviço -> por isso DB_HOST=postgres-aula.

services:
  postgres-aula:
    image: postgres
    container_name: postgres-aula
    environment:
      POSTGRES_DB: auladb
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Crie o arquivo .env com DB_PASSWORD (Copy-Item .env.example .env)}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d auladb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: estudopi
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres-aula
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres-aula:
        condition: service_healthy   # só sobe o app quando o Postgres estiver pronto
