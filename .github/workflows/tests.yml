# Roda quando alguém abre (ou atualiza) um Pull Request.
# Compila, roda TODOS os testes, gera o relatório do JaCoCo e comenta a cobertura no PR.
name: Testes

permissions:
  contents: read
  pull-requests: write          # deixa o bot do JaCoCo comentar no PR

on:
  pull_request:
    branches: [ "main", "master" ]   # funciona com qualquer um dos dois nomes de branch

jobs:
  build:

    runs-on: ubuntu-latest      # já tem Docker -> o Testcontainers funciona aqui

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # install passa pela fase verify -> roda o jacoco:check (100% no service)
      - name: Build with Maven
        run: mvn clean install

      - name: Check JaCoCo coverage
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: |
            tests/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          fail-build: true
